name: Source quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  quality:
    name: Test, lint, and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Check TPS runtime namespace
        run: npm run tps:namespace:check

      - name: Run TypeScript and ESLint checks
        run: |
          npx tsc --noEmit --skipLibCheck
          npm run lint

      - name: Lint styles
        run: npm run lint:styles

      - name: Build standalone release artifact
        run: npm run build

      - name: Check TPS release artifact identity
        run: npm run tps:artifacts:check

      - name: Check generated files
        run: git diff --exit-code
